name: Autobump releases

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: tap-autobump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  autobump:
    runs-on: macos-15-intel
    env:
      HOMEBREW_BUMP_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
    steps:
      - name: Check configuration
        run: |
          if [[ -z "$HOMEBREW_BUMP_TOKEN" ]]; then
            echo "::error::HOMEBREW_BUMP_TOKEN is required"
            exit 1
          fi

      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Supersede stale first-party version PRs
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: python3 scripts/tap_release.py prepare

      - name: Set up Homebrew
        if: env.HOMEBREW_BUMP_TOKEN != ''
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}

      - name: Open version bump pull requests
        if: env.HOMEBREW_BUMP_TOKEN != ''
        uses: Homebrew/actions/bump-packages@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          formulae: >
            omcli
            scaletail
          casks: >
            minitools
            rustdeskx
          fork: false

      - name: Verify latest stable versions are represented
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/tap_release.py report | tee -a "$GITHUB_STEP_SUMMARY"
