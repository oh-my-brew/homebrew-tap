name: Publish omcli bottle

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'bump-omcli-')
    runs-on: macos-15
    env:
      PRODUCT_REPOSITORY: oh-my-brew/omcli
    steps:
      - name: Resolve trusted omcli bump
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$pr_number" ]]; then
            echo "The successful workflow run is not associated with a pull request" >&2
            exit 1
          fi

          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          state=$(jq -r '.state' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr_json")

          [[ "$state" == open ]]
          [[ "$base_ref" == main ]]
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]
          [[ "$head_ref" == bump-omcli-* ]]
          [[ "$head_sha" == "$RUN_HEAD_SHA" ]]

          changed_files=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files" \
              --jq '.[].filename'
          )
          if [[ "$changed_files" != Formula/omcli.rb ]]; then
            echo "Refusing to publish: the PR must only change Formula/omcli.rb" >&2
            printf 'changed:\n%s\n' "$changed_files" >&2
            exit 1
          fi

          {
            echo "pr_number=$pr_number"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "run_id=$RUN_ID"
          } >>"$GITHUB_OUTPUT"

      - name: Check out the tested PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and existing bottle state
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        run: |
          set -euo pipefail

          version=$(
            sed -nE \
              's|^  url "https://github.com/oh-my-brew/omcli/releases/download/v([^/]+)/omcli-[^"]+\.tar\.gz"$|\1|p' \
              Formula/omcli.rb
          )
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Could not resolve one omcli version from Formula/omcli.rb" >&2
            exit 1
          fi
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          [[ "$HEAD_REF" == "bump-omcli-$version"* ]]

          expected_root="https://github.com/$PRODUCT_REPOSITORY/releases/download/v$version"
          expected_asset="omcli-$version.arm64_tahoe.bottle.tar.gz"
          current_root=$(sed -nE 's|^    root_url "([^"]+)"$|\1|p' Formula/omcli.rb)
          current_sha=$(
            sed -nE \
              's|^    sha256 cellar: :any_skip_relocation, arm64_tahoe: "([0-9a-f]{64})"$|\1|p' \
              Formula/omcli.rb
          )
          release_sha=$(
            gh release view "v$version" --repo "$PRODUCT_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$expected_asset\") | .digest" |
              sed -nE 's/^sha256:([0-9a-f]{64})$/\1/p'
          )

          skip=false
          if [[ "$current_root" == "$expected_root" && -n "$release_sha" && "$current_sha" == "$release_sha" ]]; then
            skip=true
            echo "Formula and product Release already reference the same bottle."
          fi

          {
            echo "version=$version"
            echo "expected_root=$expected_root"
            echo "expected_asset=$expected_asset"
            echo "skip=$skip"
          } >>"$GITHUB_OUTPUT"

      - name: Download the macOS bottle artifact
        if: steps.formula.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/omcli-bottle"
          rm -rf "$artifact_dir"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name bottles_macos-26 --dir "$artifact_dir"

      - name: Validate and prepare the bottle
        if: steps.formula.outputs.skip != 'true'
        id: bottle
        env:
          VERSION: ${{ steps.formula.outputs.version }}
          EXPECTED_ROOT: ${{ steps.formula.outputs.expected_root }}
          EXPECTED_ASSET: ${{ steps.formula.outputs.expected_asset }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "omcli-bottle"
          version = os.environ["VERSION"]
          expected_asset = os.environ["EXPECTED_ASSET"]
          json_files = list(artifact_dir.glob(f"omcli--{version}.arm64_tahoe.bottle.json"))
          archives = list(artifact_dir.glob(f"omcli--{version}.arm64_tahoe.bottle.tar.gz"))
          if len(json_files) != 1 or len(archives) != 1:
              raise SystemExit("Expected one arm64_tahoe bottle JSON and archive")

          json_path = json_files[0]
          archive_path = archives[0]
          data = json.loads(json_path.read_text())
          entry = data.get("oh-my-brew/tap/omcli")
          if not entry or entry["formula"]["pkg_version"] != version:
              raise SystemExit("Bottle metadata does not match the omcli version")
          tags = entry["bottle"]["tags"]
          if set(tags) != {"arm64_tahoe"}:
              raise SystemExit("Bottle metadata must contain only arm64_tahoe")
          tag = tags["arm64_tahoe"]
          if tag["filename"] != expected_asset:
              raise SystemExit("Bottle filename does not match the release asset name")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if digest != tag["sha256"]:
              raise SystemExit("Bottle archive SHA256 does not match its metadata")

          publish_path = artifact_dir / expected_asset
          shutil.copyfile(archive_path, publish_path)
          entry["bottle"]["root_url"] = os.environ["EXPECTED_ROOT"]
          json_path.write_text(json.dumps(data, indent=2) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"archive={publish_path}", file=output)
              print(f"json={json_path}", file=output)
              print(f"sha256={digest}", file=output)
          PY

      - name: Publish bottle to the omcli Release
        if: steps.formula.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
          ARCHIVE: ${{ steps.bottle.outputs.archive }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$PRODUCT_REPOSITORY" >/dev/null
          gh release upload "v$VERSION" "$ARCHIVE" \
            --repo "$PRODUCT_REPOSITORY" --clobber

      - name: Write bottle metadata to the Formula
        if: steps.formula.outputs.skip != 'true'
        env:
          BOTTLE_JSON: ${{ steps.bottle.outputs.json }}
          VERSION: ${{ steps.formula.outputs.version }}
          EXPECTED_ROOT: ${{ steps.formula.outputs.expected_root }}
          EXPECTED_SHA: ${{ steps.bottle.outputs.sha256 }}
        run: |
          set -euo pipefail
          brew bottle --merge --write --no-commit "$BOTTLE_JSON"
          brew style Formula/omcli.rb
          git diff --check

          git diff --quiet -- Formula/omcli.rb && {
            echo "Bottle metadata did not change Formula/omcli.rb" >&2
            exit 1
          }
          [[ $(git status --short | wc -l | tr -d ' ') == 1 ]]
          [[ $(git status --short) == " M Formula/omcli.rb" ]]
          grep -Fq "root_url \"$EXPECTED_ROOT\"" Formula/omcli.rb
          grep -Fq "arm64_tahoe: \"$EXPECTED_SHA\"" Formula/omcli.rb

      - name: Commit bottle metadata to the bump PR
        if: steps.formula.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_BUMP_TOKEN is required" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/omcli.rb
          git commit -m "Add bottle for omcli $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "HEAD:$HEAD_REF"
