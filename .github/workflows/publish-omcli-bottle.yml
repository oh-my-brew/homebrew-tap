name: Publish omcli bottle

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'bump-omcli-')
    runs-on: ubuntu-latest
    env:
      PRODUCT_REPOSITORY: oh-my-brew/omcli
    steps:
      - name: Resolve trusted omcli bump
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$pr_number" ]]; then
            echo "The successful workflow run is not associated with a pull request" >&2
            exit 1
          fi

          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          state=$(jq -r '.state' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          base_sha=$(jq -r '.base.sha' <<<"$pr_json")
          head_ref=$(jq -r '.head.ref' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr_json")

          [[ "$state" == open ]]
          [[ "$base_ref" == main ]]
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]
          [[ "$head_ref" == bump-omcli-* ]]
          [[ "$head_sha" == "$RUN_HEAD_SHA" ]]

          changed_files=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files" \
              --jq '.[].filename'
          )
          if [[ "$changed_files" != Formula/omcli.rb ]]; then
            echo "Refusing to publish: the PR must only change Formula/omcli.rb" >&2
            printf 'changed:\n%s\n' "$changed_files" >&2
            exit 1
          fi

          {
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "run_id=$RUN_ID"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch and validate Formula text
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/omcli-publish"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"

          gh api "repos/$GITHUB_REPOSITORY/contents/Formula/omcli.rb?ref=$BASE_SHA" \
            --jq .content | base64 --decode >"$work_dir/base.rb"
          gh api "repos/$GITHUB_REPOSITORY/contents/Formula/omcli.rb?ref=$HEAD_SHA" \
            --jq .content | base64 --decode >"$work_dir/head.rb"

          python3 <<'PY'
          import os
          from pathlib import Path
          import re

          work_dir = Path(os.environ["RUNNER_TEMP"]) / "omcli-publish"
          base = (work_dir / "base.rb").read_text()
          head = (work_dir / "head.rb").read_text()
          url_re = re.compile(
              r'^  url "https://github\.com/oh-my-brew/omcli/releases/download/'
              r'v(?P<version>[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)/'
              r'omcli-(?P=version)\.tar\.gz"$',
              re.MULTILINE,
          )
          source_sha_re = re.compile(r'^  sha256 "(?P<sha>[0-9a-f]{64})"$', re.MULTILINE)
          bottle_re = re.compile(r'^  bottle do\n(?:    .*\n)+?  end\n', re.MULTILINE)

          def one(pattern, text, label):
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {label}, found {len(matches)}")
              return matches[0]

          one(url_re, base, "base source URL")
          head_url = one(url_re, head, "head source URL")
          one(source_sha_re, base, "base source SHA")
          head_source_sha = one(source_sha_re, head, "head source SHA")
          one(bottle_re, base, "base bottle block")
          one(bottle_re, head, "head bottle block")

          def normalize(text):
              text, url_count = url_re.subn('  url "OMCLI_SOURCE_URL"', text)
              text, sha_count = source_sha_re.subn('  sha256 "OMCLI_SOURCE_SHA"', text)
              text, bottle_count = bottle_re.subn(
                  '  bottle do\n    OMCLI_BOTTLE\n  end\n', text
              )
              if (url_count, sha_count, bottle_count) != (1, 1, 1):
                  raise SystemExit("Formula normalization did not replace exactly the allowed fields")
              return text

          if normalize(base) != normalize(head):
              raise SystemExit(
                  "Refusing to publish: Formula changes outside source URL, source SHA, or bottle block"
              )

          version = head_url.group("version")
          if not os.environ["HEAD_REF"].startswith(f"bump-omcli-{version}"):
              raise SystemExit("PR branch does not match the Formula version")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"source_sha={head_source_sha.group('sha')}", file=output)
              print(f"formula_path={work_dir / 'head.rb'}", file=output)
          PY

      - name: Verify product Release and current bottle state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.formula.outputs.version }}
          SOURCE_SHA: ${{ steps.formula.outputs.source_sha }}
          FORMULA_PATH: ${{ steps.formula.outputs.formula_path }}
        run: |
          set -euo pipefail
          source_asset="omcli-$VERSION.tar.gz"
          release_json=$(gh release view "v$VERSION" --repo "$PRODUCT_REPOSITORY" --json assets)
          release_source_sha=$(
            jq -r --arg name "$source_asset" \
              '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json" |
              sed -nE 's/^sha256:([0-9a-f]{64})$/\1/p'
          )
          if [[ -z "$release_source_sha" || "$release_source_sha" != "$SOURCE_SHA" ]]; then
            echo "Formula source SHA does not match the product Release" >&2
            exit 1
          fi

          expected_root="https://github.com/$PRODUCT_REPOSITORY/releases/download/v$VERSION"
          current_root=$(sed -nE 's|^    root_url "([^"]+)"$|\1|p' "$FORMULA_PATH")
          current_rebuild=$(sed -nE 's|^    rebuild ([0-9]+)$|\1|p' "$FORMULA_PATH")
          current_rebuild=${current_rebuild:-0}
          if (( current_rebuild == 0 )); then
            current_asset="omcli-$VERSION.arm64_tahoe.bottle.tar.gz"
          else
            current_asset="omcli-$VERSION.arm64_tahoe.bottle.$current_rebuild.tar.gz"
          fi
          release_bottle_sha=$(
            jq -r --arg name "$current_asset" \
              '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json" |
              sed -nE 's/^sha256:([0-9a-f]{64})$/\1/p'
          )
          current_sha=$(
            sed -nE \
              's|^    sha256 cellar: :any_skip_relocation, arm64_tahoe: "([0-9a-f]{64})"$|\1|p' \
              "$FORMULA_PATH"
          )

          skip=false
          if [[ "$current_root" == "$expected_root" && -n "$release_bottle_sha" && "$current_sha" == "$release_bottle_sha" ]]; then
            skip=true
            echo "Formula and product Release already reference the same bottle."
          fi

          {
            echo "expected_root=$expected_root"
            echo "skip=$skip"
          } >>"$GITHUB_OUTPUT"

      - name: Download the macOS bottle artifact
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/omcli-bottle"
          rm -rf "$artifact_dir"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name bottles_macos-26 --dir "$artifact_dir"

      - name: Validate artifact and render Formula
        if: steps.release.outputs.skip != 'true'
        id: bottle
        env:
          VERSION: ${{ steps.formula.outputs.version }}
          FORMULA_PATH: ${{ steps.formula.outputs.formula_path }}
          EXPECTED_ROOT: ${{ steps.release.outputs.expected_root }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "omcli-bottle"
          version = os.environ["VERSION"]
          json_files = list(artifact_dir.glob(f"omcli--{version}.arm64_tahoe.bottle.json"))
          if len(json_files) != 1:
              raise SystemExit("Expected one arm64_tahoe bottle JSON")

          data = json.loads(json_files[0].read_text())
          entry = data.get("oh-my-brew/tap/omcli")
          if not entry or entry["formula"]["pkg_version"] != version:
              raise SystemExit("Bottle metadata does not match the omcli version")
          if entry["bottle"].get("cellar") != "any_skip_relocation":
              raise SystemExit("Bottle must be relocatable without a Cellar prefix")
          rebuild = entry["bottle"].get("rebuild", 0)
          if not isinstance(rebuild, int) or rebuild < 0:
              raise SystemExit("Bottle rebuild must be a non-negative integer")
          tags = entry["bottle"]["tags"]
          if set(tags) != {"arm64_tahoe"}:
              raise SystemExit("Bottle metadata must contain only arm64_tahoe")
          tag = tags["arm64_tahoe"]
          suffix = f".{rebuild}" if rebuild else ""
          expected_asset = f"omcli-{version}.arm64_tahoe.bottle{suffix}.tar.gz"
          expected_local = f"omcli--{version}.arm64_tahoe.bottle{suffix}.tar.gz"
          if tag.get("filename") != expected_asset or tag.get("local_filename") != expected_local:
              raise SystemExit("Bottle filenames do not match version, tag, and rebuild metadata")

          archive_path = artifact_dir / expected_local
          if not archive_path.is_file():
              raise SystemExit("Bottle archive named by metadata is missing")
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if digest != tag["sha256"]:
              raise SystemExit("Bottle archive SHA256 does not match its metadata")

          publish_path = artifact_dir / expected_asset
          shutil.copyfile(archive_path, publish_path)
          formula_path = Path(os.environ["FORMULA_PATH"])
          formula = formula_path.read_text()
          bottle_re = re.compile(r'^  bottle do\n(?:    .*\n)+?  end\n', re.MULTILINE)
          bottle_lines = [
              "  bottle do\n",
              f"    root_url \"{os.environ['EXPECTED_ROOT']}\"\n",
          ]
          if rebuild:
              bottle_lines.append(f"    rebuild {rebuild}\n")
          bottle_lines.extend([
              f"    sha256 cellar: :any_skip_relocation, arm64_tahoe: \"{digest}\"\n",
              "  end\n",
          ])
          bottle_block = "".join(bottle_lines)
          updated, count = bottle_re.subn(bottle_block, formula)
          if count != 1:
              raise SystemExit("Expected exactly one bottle block in Formula/omcli.rb")
          updated_path = formula_path.with_name("updated.rb")
          updated_path.write_text(updated)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"archive={publish_path}", file=output)
              print(f"formula={updated_path}", file=output)
              print(f"sha256={digest}", file=output)
              print(f"asset={expected_asset}", file=output)
              print(f"rebuild={rebuild}", file=output)
          PY
          ruby -c "$RUNNER_TEMP/omcli-publish/updated.rb"

      - name: Publish bottle to the omcli Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
          ARCHIVE: ${{ steps.bottle.outputs.archive }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_BUMP_TOKEN is required" >&2
            exit 1
          fi
          gh release upload "v$VERSION" "$ARCHIVE" \
            --repo "$PRODUCT_REPOSITORY" --clobber

      - name: Commit Formula to the tested PR branch
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          FORMULA_PATH: ${{ steps.bottle.outputs.formula }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_BUMP_TOKEN is required" >&2
            exit 1
          fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            echo "PR head changed after bottle validation; refusing a stale write" >&2
            exit 1
          fi

          blob_sha=$(
            jq -Rs '{content: ., encoding: "utf-8"}' <"$FORMULA_PATH" |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha
          )
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          tree_sha=$(
            jq -n --arg base_tree "$base_tree" --arg blob_sha "$blob_sha" \
              '{base_tree: $base_tree, tree: [{path: "Formula/omcli.rb", mode: "100644", type: "blob", sha: $blob_sha}]}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha
          )
          commit_sha=$(
            jq -n --arg message "Add bottle for omcli $VERSION" --arg tree "$tree_sha" --arg parent "$HEAD_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha
          )
          jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}' |
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" --input - >/dev/null
